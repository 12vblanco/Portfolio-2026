[build]
  command = "npm run build"
  publish = "dist"

# Redirect www to non-www (canonical domain)
[[redirects]]
  from = "https://www.victorblancoweb.com/*"
  to = "https://victorblancoweb.com/:splat"
  status = 301
  force = true

# 301 redirects for old/removed pages
[[redirects]]
  from = "/VarunaCase"
  to = "/"
  status = 301

[[redirects]]
  from = "/home"
  to = "/"
  status = 301

[[redirects]]
  from = "/UXCase"
  to = "/"
  status = 301

[[redirects]]
  from = "/OrchardCase"
  to = "/"
  status = 301

[[redirects]]
  from = "/terms"
  to = "/"
  status = 301

# /insights has no index page of its own — send it to the insights section
[[redirects]]
  from = "/insights"
  to = "/pendo-consultant#insights"
  status = 301

# No SPA catch-all: every route is prerendered to a real HTML file at build
# time (see scripts/prerender.js), so unknown paths correctly serve 404.html
# with a real 404 status instead of soft-404ing with the homepage.

# Hashed build assets are immutable — cache forever
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
