[build]
  command = "npm run build"
  publish = "dist"

# Redirect www to non-www (canonical domain)
[[redirects]]
  from = "https://www.victorblancoweb.com/*"
  to = "https://victorblancoweb.com/:splat"
  status = 301
  force = true

# 301 redirects for old/removed pages
[[redirects]]
  from = "/VarunaCase"
  to = "/"
  status = 301

[[redirects]]
  from = "/home"
  to = "/"
  status = 301

[[redirects]]
  from = "/UXCase"
  to = "/"
  status = 301

[[redirects]]
  from = "/OrchardCase"
  to = "/"
  status = 301

[[redirects]]
  from = "/terms"
  to = "/"
  status = 301

# The case-study previews moved to real /work/<slug> routes when they were
# published. They were noindex and out of the sitemap while staged, so little
# should point at them, but the old paths were live HTML for a while.
[[redirects]]
  from = "/OrchardCaseStudyPage"
  to = "/work/the-orchard-bar"
  status = 301

[[redirects]]
  from = "/LMDouglasCaseStudyPage"
  to = "/work/lm-douglas"
  status = 301

[[redirects]]
  from = "/OMSCaseStudyPage"
  to = "/work/orders-made-simple"
  status = 301

[[redirects]]
  from = "/SujinCaseStudyPage"
  to = "/work/sujin-kim"
  status = 301

# /insights is now a real prerendered hub page (dist/insights.html), not a redirect.

# No SPA catch-all: every route is prerendered to a real HTML file at build
# time (see scripts/prerender.js), so unknown paths correctly serve 404.html
# with a real 404 status instead of soft-404ing with the homepage.

# Hashed build assets are immutable — cache forever
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
