<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary meta tags (title, description, canonical, og:*, twitter:*) are
       per-page: the SEO component manages them at runtime and
       scripts/prerender.js bakes them into each page's static HTML at build time -->

  <meta name="author" content="Victor Blanco" />

  <!-- Sitemap -->
  <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/blanco.png" />

  <!-- Switzer (self-hosted, ITF Free Font License via Fontshare) -->
  <link rel="preload" href="/fonts/switzer-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/switzer-700.woff2" as="font" type="font/woff2" crossorigin />
  <style>
    @font-face { font-family: 'Switzer'; src: url('/fonts/switzer-400.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: 'Switzer'; src: url('/fonts/switzer-500.woff2') format('woff2'); font-weight: 500; font-style: normal; font-display: swap; }
    @font-face { font-family: 'Switzer'; src: url('/fonts/switzer-600.woff2') format('woff2'); font-weight: 600; font-style: normal; font-display: swap; }
    @font-face { font-family: 'Switzer'; src: url('/fonts/switzer-700.woff2') format('woff2'); font-weight: 700; font-style: normal; font-display: swap; }
    @font-face { font-family: 'Switzer'; src: url('/fonts/switzer-800.woff2') format('woff2'); font-weight: 800; font-style: normal; font-display: swap; }
    @font-face { font-family: 'Switzer'; src: url('/fonts/switzer-900.woff2') format('woff2'); font-weight: 900; font-style: normal; font-display: swap; }
  </style>

  <!-- Analytics (GA4 + Pendo) load only after cookie consent.
       The ConsentBanner calls window.__loadAnalytics() on accept;
       returning visitors who already accepted load it immediately. -->
  <script>
  (function () {
    function loadAnalytics() {
      if (window.__analyticsLoaded) return;
      window.__analyticsLoaded = true;

      // ── Google Analytics ──
      var ga = document.createElement('script');
      ga.async = true;
      ga.src = 'https://www.googletagmanager.com/gtag/js?id=G-G3WPB51996';
      document.head.appendChild(ga);
      window.dataLayer = window.dataLayer || [];
      window.gtag = function () { dataLayer.push(arguments); };
      gtag('js', new Date());
      gtag('config', 'G-G3WPB51996');

      // ── Pendo agent (anonymous tracking) ──
      (function (publicAppId) {
        function getCookie(name) {
          var match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
          return match ? match[2] : null;
        }
        function getVisitorId() {
          var saved = getCookie('pendo_visitor_id');
          if (saved) return saved;
          var id = 'anon_' + Math.random().toString(36).substring(2, 15) + Date.now().toString(36);
          document.cookie = 'pendo_visitor_id=' + id + '; max-age=31536000; path=/';
          return id;
        }

        (function(p,e,n,d,o){var v,w,x,y,z;o=p[d]=p[d]||{};o._q=o._q||[];
        v=['initialize','identify','updateOptions','pageLoad','track','trackAgent'];for(w=0,x=v.length;w<x;++w)(function(m){
        o[m]=o[m]||function(){o._q[m===v[0]?'unshift':'push']([m].concat([].slice.call(arguments,0)));};})(v[w]);
        y=e.createElement(n);y.async=!0;y.src='https://cdn.eu.pendo.io/agent/static/'+publicAppId+'/pendo.js';
        z=e.getElementsByTagName(n)[0];z.parentNode.insertBefore(y,z);})(window,document,'script','pendo');

        pendo.initialize({
          visitor: { id: getVisitorId() },
          account: { id: 'victor-blanco-portfolio' }
        });
      })('d9b3f220-ae26-4432-baf6-253841dfa6a9');
    }

    window.__loadAnalytics = loadAnalytics;
    try {
      if (localStorage.getItem('cookiesAccepted') === 'true') loadAnalytics();
    } catch (e) { /* storage unavailable: stay unloaded */ }
  })();
  </script>

  <!-- Main Script (Module) -->
  <script type="module" src="/src/main.jsx"></script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
